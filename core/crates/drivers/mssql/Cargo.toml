[package]
name = "kemable-driver-mssql"
description = "SQL Server through tiberius, with Windows integrated login."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
kemable-core.workspace = true
rustls.workspace = true
tiberius.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(windows)'.dependencies]
tiberius = { workspace = true, features = ["winauth"] }

[dev-dependencies]
kemable-store.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
