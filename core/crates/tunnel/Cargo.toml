[package]
name = "kemable-tunnel"
description = "SSH tunnels: a local port forwarded through an SSH server to a database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
kemable-core.workspace = true
russh.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
# Host keys for the SSH server inside the tests, as russh generates them.
rand = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
