name: Issue
description: Report a bug, suggest a feature, or ask a question
title: "[Issue]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to open an issue!

        Please search existing issues before creating a new one.

        **Pull requests are welcome.** For anything large, open an issue first so we can agree on the approach.
        Your first pull request asks you to sign the [Contributor License Agreement](https://github.com/SoleBuilt/Kemable/blob/main/CLA.md).

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of issue is this?
      options:
        - Bug report
        - Feature request
        - Question
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug, the feature you want, or your question. For features, explain the problem you are trying to solve.
      placeholder: A clear and concise description...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (bugs only)
      description: How can we reproduce the problem?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior (bugs only)
      description: What did you expect to happen, and what happened instead?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Kemable version
      description: The version you installed, or the commit you built from source.
      placeholder: e.g. 0.1.0, or commit 0d8390d
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your Windows version, how you run Kemable, and the database involved.
      placeholder: |
        - Windows: 11 24H2
        - Running: installer (Just me / Everyone), or `pnpm tauri dev`
        - Database: PostgreSQL 17 / SQL Server 2022 / SQLite / Redis 7 / Cloudflare D1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant error messages or drag in screenshots. Do not include passwords, connection strings, API keys or private data.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
