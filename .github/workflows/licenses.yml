name: Licenses

# Every dependency must allow both the AGPL and the commercial build, and the
# notices shipped with the app must list them (docs/decisions/0023-licensing.md).
# The same two steps run in scripts/verify.mjs; here they guard each pull request,
# and a ruleset can require the "licenses" check before a merge.
on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]

concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The versions scripts/licenses.mjs expects, so the notices are written the same here.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3

      - name: Install the UI's packages
        working-directory: ui/windows
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Crates' licenses and sources (deny.toml)
        run: cargo deny --log-level error check licenses bans sources

      - name: npm packages' licenses, and the notices up to date
        run: node scripts/licenses.mjs --check
