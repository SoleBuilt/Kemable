name: Release

# A version tag (v0.2.0) builds the Windows installer, signs it for the updater, and
# drafts a GitHub release with the installer, its signature and latest.json, which
# the app reads at launch (docs/decisions/0028-updates.md). The release stays a draft
# until someone publishes it; only a published release that is not a pre-release is
# what releases/latest/download/latest.json, and so the app, sees.
#
# The updater's private key lives only in this repository's secrets:
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Before the long build: the tag is the app's version and its notes are written.
      - name: Check the version and the notes
        run: node scripts/release.mjs check "$TAG"

      - name: Install the UI's packages
        working-directory: ui/windows
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      # rustup reads rust-toolchain.toml and installs that Rust on the first cargo call.
      - name: Build the installer and sign it for the updater
        working-directory: ui/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Write latest.json
        run: node scripts/release.mjs manifest "$TAG" > release-files.txt

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < release-files.txt
          gh release create "$TAG" --draft --verify-tag --title "Kemable ${TAG#v}" \
            --notes-file target/release/release-notes.md "${files[@]}"
