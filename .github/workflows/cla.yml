name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Every pull request event, the closed one too, so a merged pull request is locked
    # and its signature comment cannot be edited away; and the two comments the action
    # answers on a pull request.
    if: |
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA.'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # Given to every workflow run by GitHub; nothing to add.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          # A branch of its own, never protected: the action commits each signature to it,
          # and main can stay protected.
          branch: "cla-signatures"
          allowlist: "DucHuynhTrung,dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, you need to sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md).

            To sign, please comment below with:

            > I have read the CLA Document and I hereby sign the CLA.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA."
