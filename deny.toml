# What a Rust dependency may be (docs/decisions/0023-licensing.md). `cargo deny check
# licenses bans sources` runs in scripts/verify.mjs and on every pull request
# (.github/workflows/licenses.yml).
#
# Kemable is AGPL-3.0-only and is also sold under a commercial license, so every
# dependency must allow both: permissive licenses only. GPL, LGPL and AGPL code
# could not ship in the commercial build, so they are not on the list.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft, file by file: usable in a closed build as long as the MPL
    # files themselves are not changed. Today only CSS parsing that Tauri pulls in.
    "MPL-2.0",
]

# Kemable's own crates are AGPL-3.0-only and never published; they are not checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
