[workspace]
resolver = "3"
members = [
    "core/crates/core",
    "core/crates/store",
    "core/crates/storage",
    "core/crates/drivers/sqlite",
    "core/crates/drivers/postgres",
    "core/crates/drivers/mssql",
    "core/crates/drivers/redis",
    "core/crates/drivers/d1",
    "ui/windows/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
kemable-core = { path = "core/crates/core" }
kemable-store = { path = "core/crates/store" }
kemable-storage = { path = "core/crates/storage" }
kemable-driver-sqlite = { path = "core/crates/drivers/sqlite" }
kemable-driver-postgres = { path = "core/crates/drivers/postgres" }
kemable-driver-mssql = { path = "core/crates/drivers/mssql" }
kemable-driver-redis = { path = "core/crates/drivers/redis" }
kemable-driver-d1 = { path = "core/crates/drivers/d1" }

async-trait = "0.1"
fallible-iterator = "0.2"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
postgres-protocol = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-platform-verifier = "0.7"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP for D1: our own rustls config (ring, the Windows trust store), the system proxy, HTTP/1.1 only.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "json", "query"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Mica behind the window. Tauri already builds it; the app calls it to learn whether Mica took.
window-vibrancy = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
# Dependencies such as SQLite stay fast in debug builds; only our crates compile unoptimized.
opt-level = 2
