[workspace]
resolver = "3"
members = [
    "core/crates/core",
    "core/crates/store",
    "core/crates/drivers/sqlite",
    "ui/windows/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
paboable-core = { path = "core/crates/core" }
paboable-store = { path = "core/crates/store" }
paboable-driver-sqlite = { path = "core/crates/drivers/sqlite" }

async-trait = "0.1"
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
# Dependencies such as SQLite stay fast in debug builds; only our crates compile unoptimized.
opt-level = 2
